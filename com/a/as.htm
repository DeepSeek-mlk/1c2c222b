<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存Deepseek客户端的msi的iso下载链接</title>
    <link rel="icon" type="image/svg+xml" href="https://fe-static.deepseek.com/chat/favicon.svg">

    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ===== 标题 ===== */
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a56db;
            text-align: center;
            margin-bottom: 16px;
        }

        .page-subtitle {
            font-size: 1rem;
            font-weight: 400;
            color: #6b7280;
            text-align: center;
            max-width: 640px;
            margin-bottom: 32px;
        }

        .page-Mieba {
            font-size: 1rem;
            font-weight: 400;
            color: #6b7280;
            text-align: center;
            max-width: 640px;
            margin-bottom: 32px;
        }

        /* ===== 表单与按钮 ===== */
        .download-form {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            color: #ffffff;
            background-color: #1a56db;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(26, 86, 219, 0.25);
        }

            .download-btn:hover {
                background-color: #1442a8;
                box-shadow: 0 6px 16px rgba(26, 86, 219, 0.35);
            }

            .download-btn:active {
                transform: translateY(1px);
                box-shadow: 0 2px 8px rgba(26, 86, 219, 0.25);
            }

            .download-btn:focus-visible {
                outline: 3px solid #93b4f5;
                outline-offset: 2px;
            }

        /* ===== 挂载点 ===== */
        #root {
            margin-top: 24px;
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 480px) {
            .page-title {
                font-size: 1.5rem;
            }

            .download-btn {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>
    <h1 class="page-title">下载DeepSeek web.iso区域</h1>
    <h3 class="page-subtitle">要下载点击下面名为"点击跳转下载链接，下载选DeepSeek web.iso"按钮</h3>
    <h6 class="page-Mieba">这灭霸扎啤把</h6>
    <form class="download-form" action="https://limewire.com/zh?referrer=pq7i8xx7p2&utm_source=file.io&utm_medium=satellite&utm_campaign=link&utm_content=%2Fzh%2F&utm_term=direct%2Fnone" method="get">
        <button class="download-btn" type="submit">点击跳转下载链接，下载选DeepSeek web.iso</button>
    </form>

    <div id="root"></div>
    <script type="application/json" id="downloadConfig">
        {
          "name": "DeepSeek",
          "short_name": "DeepSeek",
          "start_url": "https://chat.deepseek.com/",
          "scope": "https://chat.deepseek.com/",
          "display": "standalone",
          "icons": [
            {
              "src": "https://fe-static.deepseek.com/chat/icon-192.png",
              "sizes": "192x192",
              "type": "image/png",
              "purpose": "any"
            },
            {
              "src": "https://fe-static.deepseek.com/chat/icon-512.png",
              "sizes": "512x512",
              "type": "image/png",
              "purpose": "any"
            }
          ]
        }</script>

        <script>
                  document.addEventListener("DOMContentLoaded", function () {
                    const form = document.getElementById("downloadForm");
                    const btn = form.querySelector("button");
                    const originalText = btn.textContent;
                    let locked = false;

                    // 拦截表单提交，改为先执行 2，再手动跳转
                    form.addEventListener("submit", function (e) {
                      e.preventDefault(); // 阻止默认提交

                      // 5：3 秒内只能点一次
                      if (locked) return;
                      locked = true;

                      // 2：文字变"跳转中..."并禁用
                      btn.textContent = "跳转中...";
                      btn.disabled = true;

                      // 2 执行完成后，跳转到目标链接
                      setTimeout(function () {
                        window.location.href = form.action;
                      }, 800); // 800ms 让用户看到"跳转中..."，可改
                    });
                  });
    </script>
</body>
</html>
